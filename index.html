<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Task Manager Ultra</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

<aside class="sidebar">
<h2>⚡ UltraTasks</h2>

<button onclick="showView('tasks')">📋 Tasks</button>
<button onclick="showView('calendar')">📅 Kalender</button>
<button onclick="showView('stats')">📊 Charts</button>

</aside>

<main class="content">

<div id="tasksView">
<h1>Tasks</h1>

<input id="taskInput" placeholder="Neue Aufgabe">
<input type="date" id="deadline">
<button onclick="addTask()">Add</button>

<div id="taskList"></div>
</div>

<div id="calendarView" class="hidden">
<h1>Kalender</h1>
<div id="calendar"></div>
</div>

<div id="statsView" class="hidden">
<h1>Stats</h1>
<canvas id="chart"></canvas>
</div>

</main>
</div>

<script src="app.js"></script>
</body>
</html>
